name: Tool & Agent Testing (06)

on:
  pull_request:
    paths:
      - "promptfooconfig.yaml"
      - "redteam.yaml"
      - "prompts/**"
  workflow_dispatch: {}

jobs:
  agent-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run tool & agent test matrix
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: promptfoo eval -c promptfooconfig.yaml -j 1 --delay 3000 --output results/latest-eval.json

      - name: Run excessive agency / tool misuse probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: promptfoo redteam run -c redteam.yaml --output results/latest-redteam.json

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-results
          path: results/
