name: Prompt Regression & Red-Team Matrix

on:
  pull_request:
    paths:
      - "promptfooconfig.yaml"
      - "redteam.yaml"
      - "prompts/**"
  workflow_dispatch: {}

jobs:
  regression-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run prompt regression matrix
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: promptfoo eval -c promptfooconfig.yaml --output results/latest-eval.json

      - name: Run red-team probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: promptfoo redteam run -c redteam.yaml --output results/latest-redteam.json

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: results/

      # Optional: fail the build if pass rate drops below a threshold.
      # promptfoo exits non-zero automatically when assertions fail,
      # so the "Run prompt regression matrix" step above already gates the PR.
