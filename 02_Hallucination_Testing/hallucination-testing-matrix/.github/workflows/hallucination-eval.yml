name: Hallucination Testing Matrix

on:
  pull_request:
    paths:
      - "promptfooconfig.yaml"
      - "redteam.yaml"
      - "prompts/**"
  workflow_dispatch: {}

jobs:
  hallucination-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run hallucination test matrix
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: promptfoo eval -c promptfooconfig.yaml -j 1 --delay 3000 --output results/latest-eval.json

      - name: Run hallucination red-team probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: promptfoo redteam run -c redteam.yaml --output results/latest-redteam.json

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallucination-results
          path: results/
